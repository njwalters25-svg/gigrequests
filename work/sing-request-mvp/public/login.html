<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard Login</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="login-shell">
      <section class="panel login-panel" aria-labelledby="loginTitle">
        <div class="brand">
          <div class="mark" aria-hidden="true">♪</div>
          <div>
            <p class="eyebrow">Singer access</p>
            <h1 id="loginTitle">Dashboard login</h1>
          </div>
        </div>

        <form class="login-form" id="loginForm">
          <label>
            Password
            <input id="dashboardPassword" type="password" autocomplete="current-password" required autofocus>
          </label>
          <button class="primary" type="submit">Log in</button>
          <p class="form-error" id="loginError" role="alert"></p>
        </form>
      </section>
    </main>

    <script src="/login.js"></script>
  </body>
</html>
